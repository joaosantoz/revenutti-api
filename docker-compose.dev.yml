services:
  app:
    image: revenu-api-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
      pull: false
    working_dir: /app
    env_file: .env.dev
    ports:
      - "8080:8080"
      - "7888:7888"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: revenu_dev
      POSTGRES_USER: revenu
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revenu -d revenu_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_dev_data:
