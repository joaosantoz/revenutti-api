services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      pull: false
    ports:
      - "8080:8080"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: revenu
      POSTGRES_USER: revenu
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revenu -d revenu"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
