services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      APP_ENV: production
      DB_URL: jdbc:postgresql://db:5432/revenu
      DB_USER: revenu
      DB_PASSWORD: secret
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: revenu
      POSTGRES_USER: revenu
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revenu -d revenu"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
